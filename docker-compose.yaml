version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: no

    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API (optional)

    volumes:
      - qdrant_storage:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage: