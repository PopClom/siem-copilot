<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIEM Copilot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --accent:#58a6ff; --accent2:#3fb950; --danger:#f85149;
    --text:#e6edf3; --muted:#8b949e; --user-bg:#1f2937;
    --bot-bg:#161b22; --pill-bg:#21262d;
    --radius:12px; --font:'Segoe UI',system-ui,sans-serif;
    --mono:'Cascadia Code','Fira Code',monospace;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--font);
         height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header { display:flex; align-items:center; gap:12px; padding:14px 24px;
            border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .logo { width:32px;height:32px; background:linear-gradient(135deg,var(--accent),var(--accent2));
          border-radius:8px; display:flex;align-items:center;justify-content:center; font-size:16px; }
  header h1 { font-size:16px; font-weight:600; }
  header .sub { font-size:12px; color:var(--muted); margin-top:1px; }
  .hdr-r { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .dot { width:8px;height:8px;border-radius:50%; background:var(--accent2);
         box-shadow:0 0 6px var(--accent2); }
  .dot.err { background:var(--danger); box-shadow:0 0 6px var(--danger); }
  .clr { background:transparent; border:1px solid var(--border); color:var(--muted);
          padding:5px 12px; border-radius:6px; font-size:12px; cursor:pointer; transition:all .15s; }
  .clr:hover { border-color:var(--accent); color:var(--accent); }

  #chat { flex:1; overflow-y:auto; padding:24px; display:flex;
           flex-direction:column; gap:20px; scroll-behavior:smooth; }

  .msg { display:flex; gap:12px; max-width:820px; animation:fadeIn .2s ease; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg.bot  { align-self:flex-start; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1} }

  .av { width:32px;height:32px;border-radius:8px;display:flex;
        align-items:center;justify-content:center;font-size:14px;flex-shrink:0; }
  .msg.user .av { background:var(--user-bg); border:1px solid var(--border); }
  .msg.bot  .av { background:linear-gradient(135deg,var(--accent),var(--accent2)); }

  .bubble { padding:12px 16px; border-radius:var(--radius); font-size:14px;
             line-height:1.65; max-width:720px; }
  .msg.user .bubble { background:var(--user-bg); border:1px solid var(--border); border-top-right-radius:3px; }
  .msg.bot  .bubble { background:var(--bot-bg);  border:1px solid var(--border); border-top-left-radius:3px; }

  .bubble p { margin-bottom:8px; }
  .bubble p:last-child { margin-bottom:0; }
  .bubble ul,.bubble ol { padding-left:20px; margin-bottom:8px; }
  .bubble li { margin-bottom:4px; }
  .bubble code { font-family:var(--mono); font-size:12px; background:#0d1117;
                  padding:2px 5px; border-radius:4px; border:1px solid var(--border); }
  .bubble pre { background:#0d1117; border:1px solid var(--border); border-radius:8px;
                 padding:12px; overflow-x:auto; margin:8px 0; }
  .bubble pre code { background:none; border:none; padding:0; }
  .bubble strong { color:#f0f6fc; }

  .tool-pill { display:inline-flex; align-items:center; gap:6px; background:var(--pill-bg);
                border:1px solid var(--border); border-radius:20px; padding:3px 10px;
                font-size:11px; color:var(--muted); margin-bottom:8px; }
  .tool-pill .pd { width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pulse 1s infinite; }
  .tool-pill.done .pd { animation:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .thinking { display:flex;gap:4px;align-items:center;padding:4px 0; }
  .thinking span { width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite; }
  .thinking span:nth-child(2){animation-delay:.2s}
  .thinking span:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }

  .sources { margin-top:10px; border-top:1px solid var(--border); padding-top:8px;
              display:flex; flex-wrap:wrap; gap:6px; }
  .schip { font-size:11px; color:var(--muted); background:var(--pill-bg);
            border:1px solid var(--border); border-radius:6px; padding:3px 8px;
            font-family:var(--mono); }
  .schip.nb { border-style:dashed; }

  .welcome { margin:auto; text-align:center; max-width:460px; }
  .wlogo { width:56px;height:56px; background:linear-gradient(135deg,var(--accent),var(--accent2));
            border-radius:14px; display:flex;align-items:center;justify-content:center;
            font-size:26px; margin:0 auto 16px; }
  .welcome h2 { font-size:20px; margin-bottom:8px; }
  .welcome p  { font-size:14px; color:var(--muted); line-height:1.6; }
  .suggs { display:flex;flex-direction:column;gap:8px;margin-top:20px;text-align:left; }
  .sugg { background:var(--surface); border:1px solid var(--border); border-radius:8px;
           padding:10px 14px; font-size:13px; color:var(--text); cursor:pointer;
           transition:border-color .15s; text-align:left; }
  .sugg:hover { border-color:var(--accent); color:var(--accent); }

  #input-area { flex-shrink:0; padding:16px 24px; border-top:1px solid var(--border); background:var(--surface); }
  .irow { display:flex; gap:10px; align-items:flex-end; max-width:820px; margin:0 auto; }
  #question { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
               color:var(--text); font-family:var(--font); font-size:14px; padding:11px 14px;
               resize:none; min-height:44px; max-height:160px; outline:none; transition:border-color .15s; line-height:1.5; }
  #question:focus { border-color:var(--accent); }
  #question::placeholder { color:var(--muted); }
  #send { width:44px;height:44px; background:var(--accent); border:none; border-radius:10px;
           color:#000; font-size:18px; cursor:pointer; display:flex;align-items:center;justify-content:center;
           transition:opacity .15s,transform .1s; flex-shrink:0; }
  #send:hover:not(:disabled){opacity:.85;transform:scale(1.04)}
  #send:disabled{opacity:.35;cursor:not-allowed}
  .hint { text-align:center; font-size:11px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<header>
  <div class="logo">🛡</div>
  <div><h1>SIEM Copilot</h1><div class="sub">Semantic security log analysis</div></div>
  <div class="hdr-r">
    <div class="dot" id="sdot"></div>
    <span style="font-size:12px;color:var(--muted)" id="slbl">Connecting…</span>
    <button class="clr" onclick="location.reload()">Clear chat</button>
  </div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="wlogo">🛡</div>
    <h2>SIEM Copilot</h2>
    <p>Ask questions about your security logs in natural language.
       I can search for specific events or run anomaly detection automatically.</p>
    <div class="suggs">
      <button class="sugg" onclick="use(this)">🔍 Were there any PowerShell execution events with encoded commands?</button>
      <button class="sugg" onclick="use(this)">🌐 Were there any suspicious network connections or DNS queries?</button>
      <button class="sugg" onclick="use(this)">⚠️ Were there anomalies or outliers in the dataset?</button>
      <button class="sugg" onclick="use(this)">🔑 Was there any lateral movement or credential dumping activity?</button>
    </div>
  </div>
</div>

<div id="input-area">
  <div class="irow">
    <textarea id="question" placeholder="Ask about your security logs…" rows="1"></textarea>
    <button id="send" onclick="send()" title="Send (Enter)">↑</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for new line</div>
</div>

<script>
const API = '';
let history = [];
let busy = false;

marked.setOptions({ breaks: true, gfm: true });

const ta = document.getElementById('question');
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,160)+'px'; });
ta.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });

function use(btn) {
  ta.value = btn.textContent.trim().replace(/^[^\w]+/,'');
  ta.dispatchEvent(new Event('input'));
  send();
}

function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addMsg(role, content='', sources=[]) {
  document.getElementById('welcome')?.remove();
  const chat=document.getElementById('chat');
  const msg=document.createElement('div'); msg.className=`msg ${role}`;
  const av=document.createElement('div'); av.className='av';
  av.textContent=role==='user'?'👤':'🛡';
  const bub=document.createElement('div'); bub.className='bubble';
  if(role==='bot'&&content===''){
    bub.innerHTML='<div class="thinking"><span></span><span></span><span></span></div>';
  } else {
    bub.innerHTML=role==='bot'?marked.parse(content):esc(content);
    if(sources.length) bub.appendChild(mkSources(sources));
  }
  msg.appendChild(av); msg.appendChild(bub);
  chat.appendChild(msg); chat.scrollTop=chat.scrollHeight;
  return bub;
}

function mkSources(sources) {
  const d=document.createElement('div'); d.className='sources';
  sources.slice(0,6).forEach(s=>{
    const c=document.createElement('span');
    c.className='schip'+(s.is_neighbour?' nb':'');
    const host=(s.host||'unknown').split('.')[0];
    const t=s.window_start?s.window_start.substring(11,19):'';
    c.textContent=`${host} ${t}`; c.title=s.window_id;
    d.appendChild(c);
  });
  return d;
}

function addPill(bub, toolName) {
  const labels={semantic_search:'🔍 Searching logs…',detect_anomalies:'🧠 Running anomaly detection…'};
  const p=document.createElement('div'); p.className='tool-pill'; p.id='pill';
  p.innerHTML=`<span class="pd"></span>${labels[toolName]||toolName}`;
  bub.insertBefore(p,bub.firstChild); return p;
}

function donePill(toolName) {
  const p=document.getElementById('pill'); if(!p)return;
  const labels={semantic_search:'🔍 Searched logs',detect_anomalies:'🧠 Anomaly detection complete'};
  p.classList.add('done');
  p.innerHTML=`<span class="pd"></span>${labels[toolName]||toolName}`;
}

async function send() {
  if(busy) return;
  const q=ta.value.trim(); if(!q)return;
  ta.value=''; ta.style.height='auto';
  document.getElementById('send').disabled=true;
  busy=true;

  addMsg('user',q);
  const bub=addMsg('bot','');

  let toolUsed=null, fullText='', sources=[], textDiv=null;

  try {
    const resp=await fetch(`${API}/query/stream`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,history}),
    });
    if(!resp.ok) throw new Error(`API error ${resp.status}`);

    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='';

    while(true){
      const{done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n\n'); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const payload=line.slice(6);

        if(payload.startsWith('__TOOL__:')){
          const meta=JSON.parse(payload.slice(9));
          toolUsed=meta.tool;
          bub.innerHTML='';
          addPill(bub,toolUsed);

        } else if(payload.startsWith('__DONE__:')){
          const meta=JSON.parse(payload.slice(9));
          sources=meta.sources||[];
          donePill(toolUsed);

        } else if(payload.startsWith('__ERROR__:')){
          bub.innerHTML=`<span style="color:var(--danger)">⚠ ${esc(payload.slice(10))}</span>`;
          setStatus(false);

        } else {
          const token=payload.replace(/\\n/g,'\n');
          if(!textDiv){
            textDiv=document.createElement('div');
            bub.appendChild(textDiv);
          }
          fullText+=token;
          textDiv.innerHTML=marked.parse(fullText);
          document.getElementById('chat').scrollTop=99999;
        }
      }
    }
    if(sources.length) bub.appendChild(mkSources(sources));
    history.push({role:'user',content:q});
    history.push({role:'assistant',content:fullText});

  } catch(err){
    bub.innerHTML=`<span style="color:var(--danger)">⚠ ${esc(err.message)}</span>`;
    setStatus(false);
  } finally {
    busy=false;
    document.getElementById('send').disabled=false;
    ta.focus();
  }
}

async function checkHealth(){
  try{
    const r=await fetch(`${API}/health`);
    const ok=r.ok&&(await r.json()).status==='ok';
    setStatus(ok);
  }catch{setStatus(false);}
}
function setStatus(ok){
  document.getElementById('sdot').className='dot'+(ok?'':' err');
  document.getElementById('slbl').textContent=ok?'Connected':'Disconnected';
}
checkHealth();
setInterval(checkHealth,30000);
</script>
</body>
</html>
