embedding:
  model: BAAI/bge-small-en-v1.5
  device: cpu
  batch-size: 512

vector-db:
  type: qdrant
  host: localhost
  port: 6333
  collection: siem_logs

llm:
  model: claude-sonnet-5
  api-key: ANTHROPIC_API_KEY # reads from ANTHROPIC_API_KEY environment variable
  temperature: 0.0 # ignored for sonnet 5 as it uses adaptive thinking

rag:
  use-hyde: true
  expand-context: false
  top-k: 20
  score-threshold: 0.30

grouping:
  host: true
  user: false
  time-window: 5s
  max-events-per-chunk: 100
  overlap-ratio: 0.5

anomaly:
  contamination: 0.10              # expected fraction of anomalous windows
  isolation-threshold: 0.7         # minimum IF score to flag a window (0–1)
  min-cluster-size: 5              # HDBSCAN minimum points to form a cluster
  include-noise-as-anomaly: true   # treat HDBSCAN noise points as anomalies

sources:
  - name: splunk_attack_sysmon
    enabled: true
    type: file
    input-format: raw-sysmon-log
    semantic-type: windows-sysmon
    path: ./datasets/splunk_attack_data/sysmon/
    recursive: true
    file-patterns:
      - "*sanitized.log"

  - name: windows_security_dataset
    enabled: false
    type: file
    input-format: raw-windows-security-log
    semantic-type: windows-security
    path: ./datasets/windows_security/
    recursive: true
    file-patterns:
      - "*.log"

  - name: wazuh_local
    enabled: false
    type: opensearch
    input-format: wazuh-opensearch
    semantic-type: windows-sysmon
    connection:
      host: localhost
      port: 9200
      index: wazuh-alerts-*
      auth:
        username: admin
        password: SecretPassword
      ssl:
        verify: false
    polling:
      enabled: true
      interval: 30s
    query:
      agent-name: windowslab
      min-rule-level: 3
